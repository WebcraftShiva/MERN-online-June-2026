<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Other Tags</title>
</head>

<body>

    <!-- 10.superscript text -->
    <h1>(A+b)<sup>2</sup></h1>

    <br>

    <!-- 9.subscript text -->
    <h1>H<sub>2</sub>O</h1>

    <br>

    <!-- 8.inserted text -->
    <ins>This is a inserted text</ins>

    <br>
    <br>
    <!-- 7. delete text -->
    <del>This is a deleted text</del>


    <br>
    <br>
    <!-- 6. small text -->
    <small>This is a small text</small>

    <!-- 5. marked tag -->
    <h1><mark>This is a mark text</mark></h1>

    <!-- 4.emphasized text -->
    <h1><em>This is a emphasised tag</em></h1>

    <!-- 3.italic text -->
    <h1><i>This is a normal Tag</i></h1>

    <br>
    <!-- 2. strong text -->
    <strong>This is a strong text</strong>

    <!-- 1. bold text -->
    <b>This is a bold text</b>





    <!-- comments -->
    <!-- ctrl + / shortcut key -->

    <!-- fsaknkfnaf
    ansfknsafk
    nsfkasn fsa
    asfnkasnfksa -->

</body>

</html>
