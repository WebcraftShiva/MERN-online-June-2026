<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <link rel="stylesheet" href="7.style.css">
</head>

<body>

    <!-- Flexbox in css is a layout system which we use to arrange items in a row or a column and we want to have a control over to the alignment , spacing and sizing of these items -->

    <div class="main">

        <h1>Flex Box's</h1>

        <div id="container">
            <div class="items" style="background-color: lightcoral;">Box 1</div>
            <div class="items" style="background-color: lightgreen;">Box 2</div>
            <div class="items" style="background-color: lightgrey;">Box 3</div>
            <div class="items" style="background-color: lightsalmon;">Box 4</div>
            <div class="items" style="background-color: lightgoldenrodyellow;">Box 5</div>
        </div>
    </div>
</body>

</html>
