<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h1>Learning About forms</h1>
    <form action="" method="put" target="">
        <center>
            <h1>Input Filed</h1>
            <input type="text" placeholder="Name">
            <br>
            <br>
            <input type="password" placeholder="password">
            <br>
            <br>
            <input type="date">
            <br>
            <br>
            <input type="time">
            <br>
            <br>
            <input type="color">

            <hr>
            <h1>Labels and buttons</h1>
            <label for="Username">Username</label>
            <input type="text" name="" id="Username" placeholder="enter your username">
            <br>
            <br>
            <label for="psw">password</label>
            <input type="password" name="" id="psw" placeholder="enter your password">

            <br>
            <br>
            <button>Submit</button>
            <button type="reset" id="xyz">Reset</button>

            <hr>
            <h1>Checkbox</h1>
            <label for="Lang">Languages I know:</label>
            <input type="checkbox" id="Lang">Python
            <input type="checkbox" name="" id="Lang" checked>Javascript

            <hr>
            <h1>Radio Button</h1>

            <input type="radio" name="gender" id="male" value="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>
            <input type="radio" name="gender" id="LBQT">
            <label for="LBQT">LBQT</label>

            <hr>
            <h1>Range</h1>
            <label for="volumne">Volume</label>
            <input type="range" id="volumne" min="0" max="100" value="30" step="20">

            <hr>
            <h1>Dropdown</h1>
            <select name="" id="">
                <option value="">C++</option>
                <option value="">Java</option>
                <option value="">Python</option>
            </select>
            <br>
            <hr>
            <h1>TextArea</h1>
            <label for="">Enter your feedback</label>
            <textarea name="" id="" cols="30" rows="10" placeholder="Please give feedback"></textarea>

        </center>



    </form>
</body>

</html>
